name: "Code scanning"

on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]
  schedule:
    - cron: "0 7 * * 2"

permissions: read-all

jobs:
  CodeQL-Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading the SARIF results to code scanning is a write; without it the
      # analyze step fails at the very end of the run.
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e429ea58a9912cadc53f8132ad35562b54de1b30 # v3.38.1

      - name: Autobuild
        uses: github/codeql-action/autobuild@e429ea58a9912cadc53f8132ad35562b54de1b30 # v3.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e429ea58a9912cadc53f8132ad35562b54de1b30 # v3.38.1
