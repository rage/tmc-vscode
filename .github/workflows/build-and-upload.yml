name: Build and Upload

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types:
      - created

permissions: read-all

env:
  PRERELEASE: ${{ endsWith ( github.event.release.tag_name, '-prerelease' ) && '--pre-release' || '' }}

jobs:
  build_and_upload:
    name: Build and Upload
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Package extension
        run: |
          chmod +x bin/package.bash
          bin/package.bash ${{ env.PRERELEASE }}
          mkdir extension && mv *.vsix extension
          # Surfaces size jumps on the run that caused them.
          echo "vsix: $(du -h extension/*.vsix | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CI: true
      # Before the upload, so that neither publish job gets a release that fails it.
      - name: Validate release
        if: github.event_name == 'release'
        run: bash bin/validateRelease.sh ${{ github.event.release.tag_name }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: packaged-extension
          path: extension/
      # The vsix excludes the maps; this artifact is the only copy.
      - name: Upload source maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: source-maps
          path: dist/*.map

  # One job per marketplace, so either can be re-run alone with the same vsix. Both wait for
  # approval in the `release` environment.
  publish_vs_marketplace:
    name: Publish to Visual Studio Marketplace
    needs: build_and_upload
    if: github.event_name == 'release'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-extension
          path: extension/
      # The version pnpm-lock.yaml pins.
      - name: Publish
        run: npx --yes @vscode/vsce@3.9.2 publish -p ${{ secrets.VSCE_PUBLISH_TOKEN }} ${{ env.PRERELEASE }} --packagePath extension/*.vsix

  publish_open_vsx:
    name: Publish to Open VSX
    needs: build_and_upload
    if: github.event_name == 'release'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-extension
          path: extension/
      - name: Publish
        run: npx --yes ovsx@1.1.1 publish extension/*.vsix -p ${{ secrets.OVSX_PUBLISHER_TOKEN }} ${{ env.PRERELEASE }}
