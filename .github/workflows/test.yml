name: Extension tests

on:
  push:
  pull_request:

permissions: read-all

# A pull request from a branch in this repository is built twice, once as the
# branch and once as the merge result. Keyed on the ref those are two groups, on
# purpose: a push must never cancel the merge-result run a reviewer waits on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_style:
    name: Code style
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint fails on an unused local, knip on an export, file or dependency
      # nothing reaches. Exporting a dead symbol otherwise clears this job.
      - name: Lint (oxlint, knip)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format:check

      # tsgo skips .svelte entirely, so the webview templates and their script
      # blocks -- the code consuming the postMessage schemas -- are only typed
      # by the svelte-check pass this script chains on the end.
      - name: Typecheck (tsgo, svelte-check)
        run: pnpm run typecheck

      # tsgo is a preview compiler. Stock tsc covers the same projects plus the
      # webview, so where the two disagree it surfaces here rather than in
      # whoever next opens the repo in an editor.
      - name: Typecheck (tsc)
        run: pnpm run typecheck:tsc

      # Regenerates from the committed shared/bindings.schema.json, so only the
      # generated output can drift here; the vendored schema itself is covered by
      # its provenance stamp below.
      - name: Langs schema drift (generate:langs-schema)
        run: bash bin/checkLangsSchemaDrift.sh

      # Only `webview:build` regenerates the release notes the Welcome panel
      # renders, so a changelog edit that skips a build ships an upgrade screen
      # that disagrees with CHANGELOG.md.
      - name: Release notes drift (generate:release-notes)
        run: node bin/generateReleaseNotes.mjs --check

      # The two vendored artifacts are copied from sibling checkouts CI does not
      # have, so it cannot re-vendor them. It asserts instead that each still
      # matches the sha256 its provenance stamp recorded at vendoring time, which
      # catches a hand-edit that never went through the vendoring script.
      - name: Vendored langs schema stamp
        run: pnpm run vendor:langs-schema -- --check-stamp

      - name: Vendored OpenAPI spec stamp
        run: pnpm run vendor:langs-openapi -- --check-stamp

      # Fetches the spec at the rev the stamp records and byte-compares, which is
      # what catches a stamp refreshed from a dirty or unpushed sibling checkout.
      # Non-blocking because the recorded rev lives on secret-project-331's
      # programming-exercise-migration branch: a force-push there would fail this
      # step for reasons this repo does not control. Drop continue-on-error once
      # sp331 PR #1769 has merged and the recorded revs are on master.
      - name: Vendored OpenAPI spec source
        continue-on-error: true
        run: pnpm run vendor:langs-openapi -- --check-source

      - name: Release tag validation (bin/validateRelease.test.sh)
        run: bash bin/validateRelease.test.sh

  unit_tests:
    name: Unit tests
    permissions:
      contents: read
    env:
      CI: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest unit + webview-component tiers mock `vscode` and run in
      # Node/jsdom, so they need neither a VS Code download nor xvfb.
      - name: Unit tests (vitest)
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test

      # One leg carries the v8 instrumentation, which is what enforces
      # vitest.config.ts's coverage thresholds; the other two run the same suite
      # uninstrumented.
      - name: Unit tests with coverage (vitest)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        with:
          name: coverage-report
          path: ./coverage/
          if-no-files-found: ignore

  mock_backend_tests:
    name: Mock backend tests
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These node:test suites check the two mocks against the contracts they
      # imitate -- `backend/mooc` against the vendored OpenAPI spec, the legacy
      # `backend/controllers` API v8 surface against tmc-langs' own bindings --
      # so they are what stops either drifting from the server every other test
      # tier trusts it to stand in for. They talk to nothing but themselves: no
      # submodules, no `backend` setup, no VS Code download, no xvfb. The script
      # enforces the pass-count floor that stops the suite vanishing silently.
      - name: Mock backend tests (node:test)
        run: bash bin/runMockBackendTests.sh

  gates:
    name: Gates can fail
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several gates above consume a glob, a generated file or a vendored
      # artifact, and each of those can go empty or stale in a way that exits 0
      # on its own. This breaks one input per gate and asserts the gate fails on
      # it; the green half is the other jobs running the same gates unbroken on
      # this commit.
      - name: Gates fail on broken input
        run: bash bin/verifyGatesCanFail.sh

  integration_tests:
    name: Integration tests
    permissions:
      contents: read
    env:
      CI: true
      VSCODE_TEST_VERSION: ${{ matrix.vscode == 'minimum' && '' || matrix.vscode }}
    strategy:
      # A platform-specific failure must not cancel the other two, or their real
      # state is unknown on exactly the runs where it matters.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every leg runs the minimum `engines.vscode` declares (config.js's
        # VSCODE_TEST_VERSION default), so the oldest VS Code the extension
        # claims to support is actually exercised; one extra leg tracks the
        # current release, where a VS Code change lands first.
        vscode: [minimum]
        include:
          - os: ubuntu-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          submodules: "true"

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup backend
        run: |
          cd backend
          pnpm run setup
          chmod -R +x cli
          cd ..

      # The integration tier drives the real tmc-langs CLI inside the VS Code
      # extension host (test-electron), so it keeps xvfb on Linux. The suite
      # spawns the bundled mock backend itself; `pretest:integration` builds
      # the extension + integration bundle.
      - name: Integration tests (test-electron)
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: pnpm run test:integration

      # The suite writes a per-run directory of downloaded exercises, langs
      # config and submission archives under test-artifacts/. It is the only
      # record of what the CLI actually did, and a failure here is usually not
      # reproducible from the log alone.
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: failure()
        with:
          name: integration-artifacts-${{ matrix.os }}-${{ matrix.vscode }}
          path: ./test-artifacts/
          if-no-files-found: ignore

  playwright_tests:
    name: Playwright tests
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          submodules: "true"

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      # `backend/cli` is what the extension downloads the tmc-langs binary from,
      # so the mock still needs its setup; starting it is playwright.config.ts's
      # `webServer`, and building the extension is `playwright-test` itself.
      - name: Setup
        run: |
          pnpm install --frozen-lockfile
          cd backend
          pnpm run setup
          chmod -R +x cli
          cd ..

      - name: Playwright tests
        run: pnpm run playwright-test

      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: failure()
        with:
          name: test-results
          path: ./test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: failure()
        with:
          name: playwright-html-report
          path: ./playwright-report/
          if-no-files-found: ignore
