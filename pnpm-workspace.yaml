packages:
  - "."
  - "webview-ui"
  - "backend"

engineStrict: true

pmOnFail: download

# Supply-chain hardening: refuse dependency versions younger than 7 days.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

nodeVersion: 24.18.0

# Reproducible resolution: resolve as of lockfile time. The npm registry does not
# expose a per-version time field, so pnpm infers it.
resolutionMode: time-based
registrySupportsTimeField: false

preferFrozenLockfile: true
trustLockfile: true

# Registry resilience. pnpm's built-in defaults (2 retries, 60s request timeout,
# 60s retry ceiling) are tight enough that a single slow or flaky registry
# response fails `pnpm install --frozen-lockfile` outright — every CI job in
# .github/workflows starts with exactly that command, and none of them retry.
# Setting this here rather than in a workflow keeps it in one place: it applies
# to all of them, to the nested `backend` install, and to local development.
fetchRetries: 5
fetchRetryFactor: 2
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
fetchTimeout: 300000

# Auto-run install when node_modules is stale before running a script.
verifyDepsBeforeRun: install

# Fail if a dependency wants to run an install/build script that is not allow-listed.
strictDepBuilds: true

confirmModulesPurge: false
updateNotifier: false

# Explicit decisions for every dependency that ships an install/build script
# (required because strictDepBuilds fails on any un-decided build).
allowBuilds:
  # esbuild (extension-host bundler + tsx backend runner) needs its native binary
  # placed by its install script.
  esbuild: true
  # Pulled in transitively; its install script only prints a reminder message.
  svelte-preprocess: false

patchedDependencies:
  ts-results@3.3.0: patches/ts-results@3.3.0.patch

minimumReleaseAgeExclude:
  # VS Code 1.131 renamed the macOS bundle's executable from
  # `Contents/MacOS/Electron` to `Contents/MacOS/Code`; 3.1.0 is the upstream
  # fix and without it the macOS integration job cannot launch VS Code at all
  # (`spawn .../Contents/MacOS/Electron ENOENT`). Test-runner tooling only, not
  # reachable from the packaged extension. Drop this entry once the release is
  # older than the 7-day policy.
  - "@vscode/test-electron@3.1.0"
  - postcss@8.5.19
  # Published 2026-07-19, i.e. comfortably past the 7-day policy in wall-clock
  # terms. It only trips the check because `resolutionMode: time-based` anchors
  # the cutoff to the lockfile's timestamp rather than to today, and this is a
  # security patch we want (see the `overrides` note below).
  - fast-uri@3.1.4

# Security overrides for advisories in packages we do not depend on directly and
# whose own parent has not yet released a bump. Every entry here is deliberately
# scoped to the major line the vulnerable copy resolves to, and every entry is a
# version the parent's declared range already allows — so this only pulls a
# security patch forward, it never forces an incompatible major on a dependent.
#
# All of these are dev/build/test tooling; none of them are reachable from the
# packaged extension (see `pnpm audit --prod`).
overrides:
  # GHSA-v2hh-gcrm-f6hx: fast-uri mis-parses a backslash authority delimiter.
  # Reached via ajv (`fast-uri: ^3.0.1`) inside the mock backend's OpenAPI
  # request/response validation. 3.1.4 is the patch release on the same line.
  fast-uri@3: 3.1.4
  # GHSA-52cp-r559-cp3m: js-yaml prototype pollution. Reached via
  # @hey-api/json-schema-ref-parser, which pins js-yaml exactly at the
  # vulnerable 4.2.0; 4.3.0 is the security release on the same major and is
  # exercised by `pnpm run generate:langs-schema`.
  js-yaml@4: 4.3.0

# This is a single workspace, so we deliberately keep ONE shared lockfile:
# sharedWorkspaceLockfile / link-protocol settings (linkWorkspacePackages,
# preferWorkspacePackages, saveWorkspaceProtocol) are omitted on purpose.
