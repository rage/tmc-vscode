name: Build and Upload

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types:
      - created

permissions: read-all

jobs:
  build_and_upload:
    name: Build and Upload
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      PRERELEASE: ${{ endsWith ( github.event.release.tag_name, '-prerelease' ) && '--pre-release' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          submodules: "true"
      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Package extension
        run: |
          chmod +x bin/package.bash
          bin/package.bash ${{ env.PRERELEASE }}
          mkdir extension && mv *.vsix extension
          # Surfaces size jumps on the run that caused them.
          echo "vsix: $(du -h extension/*.vsix | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CI: true
      - name: Upload artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: success()
        with:
          name: packaged-extension
          path: extension/
      # The vsix excludes the maps; this artifact is the only copy.
      - name: Upload source maps
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: success()
        with:
          name: source-maps
          path: dist/*.map
      - name: Publish to Visual Studio Marketplace
        if: success() && github.event_name == 'release'
        run: |
          chmod +x bin/validateRelease.sh
          bin/validateRelease.sh ${{ github.event.release.tag_name }}
          pnpm exec vsce publish -p ${{ secrets.VSCE_PUBLISH_TOKEN }} ${{ env.PRERELEASE }} --packagePath extension/*.vsix
      - name: Publish to Open VSX Marketplace
        if: success() && github.event_name == 'release'
        run: |
          pnpm exec ovsx publish extension/*.vsix -p ${{ secrets.OVSX_PUBLISHER_TOKEN }} ${{ env.PRERELEASE }}
