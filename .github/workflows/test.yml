name: Extension tests

on:
  push:
  pull_request:

permissions: read-all

# A pull request from a branch in this repository is built twice, once as the
# branch and once as the merge result. Keyed on the ref those are two groups, on
# purpose: a push must never cancel the merge-result run a reviewer waits on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_style:
    name: Code style
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm run lint:ci

      - name: Format check (oxfmt)
        run: pnpm run format:check

      # tsgo skips .svelte entirely, so the webview templates and their script
      # blocks -- the code consuming the postMessage schemas -- are only typed
      # by the svelte-check pass this script chains on the end.
      - name: Typecheck (tsgo, svelte-check)
        run: pnpm run typecheck

      # Regenerates from the committed shared/bindings.schema.json, so only the
      # generated output can drift here; the vendored schema itself is covered by
      # its provenance stamp below.
      - name: Langs schema drift (generate:langs-schema)
        run: bash bin/checkLangsSchemaDrift.sh

      # The two vendored artifacts are copied from sibling checkouts CI does not
      # have, so it cannot re-vendor them. It asserts instead that each still
      # matches the sha256 its provenance stamp recorded at vendoring time, which
      # catches a hand-edit that never went through the vendoring script.
      - name: Vendored langs schema stamp
        run: pnpm run vendor:langs-schema -- --check-stamp

      - name: Vendored OpenAPI spec stamp
        run: pnpm run vendor:langs-openapi -- --check-stamp

      # Fetches the spec at the rev the stamp records and byte-compares, which is
      # what catches a stamp refreshed from a dirty or unpushed sibling checkout.
      # Non-blocking because the recorded rev lives on secret-project-331's
      # programming-exercise-migration branch: a force-push there would fail this
      # step for reasons this repo does not control. Drop continue-on-error once
      # sp331 PR #1769 has merged and the recorded revs are on master.
      - name: Vendored OpenAPI spec source
        continue-on-error: true
        run: pnpm run vendor:langs-openapi -- --check-source

      - name: Release tag validation (bin/validateRelease.test.sh)
        run: bash bin/validateRelease.test.sh

  unit_tests:
    name: Unit tests
    permissions:
      contents: read
    env:
      CI: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest unit + webview-component tiers mock `vscode` and run in
      # Node/jsdom, so they need neither a VS Code download nor xvfb.
      - name: Unit tests (vitest)
        run: pnpm test

  mock_backend_tests:
    name: Mooc mock backend tests
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These node:test suites check the mooc mock in `backend/mooc` against the
      # vendored OpenAPI spec, so they are what stops it drifting from the real
      # courses.mooc.fi API that every other mooc test tier trusts it to imitate.
      # They talk to nothing but themselves: no submodules, no `backend` setup,
      # no VS Code download, no xvfb. The script enforces the pass-count floor
      # that stops the suite vanishing silently.
      - name: Mock backend tests (node:test)
        run: bash bin/runMockBackendTests.sh

  gates:
    name: Gates can fail
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several gates above consume a glob, a generated file or a vendored
      # artifact, and each of those can go empty or stale in a way that exits 0
      # on its own. This breaks one input per gate and asserts the gate fails on
      # it; the green half is the other jobs running the same gates unbroken on
      # this commit.
      - name: Gates fail on broken input
        run: bash bin/verifyGatesCanFail.sh

  integration_tests:
    name: Integration tests
    permissions:
      contents: read
    env:
      CI: true
    strategy:
      # A platform-specific failure must not cancel the other two, or their real
      # state is unknown on exactly the runs where it matters.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0
        with:
          submodules: "true"

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup backend
        run: |
          cd backend
          pnpm run setup
          chmod -R +x cli
          cd ..

      # The integration tier drives the real tmc-langs CLI inside the VS Code
      # extension host (test-electron), so it keeps xvfb on Linux. The suite
      # spawns the bundled mock backend itself; `pretest:integration` builds
      # the extension + integration bundle.
      - name: Integration tests (test-electron)
        uses: coactions/setup-xvfb@v1.0.1
        with:
          run: pnpm run test:integration

  playwright_tests:
    name: Playwright tests
    permissions:
      contents: read
    env:
      CI: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0
        with:
          submodules: "true"

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      # `backend/cli` is what the extension downloads the tmc-langs binary from,
      # so the mock still needs its setup; starting it is playwright.config.ts's
      # `webServer`, and building the extension is `playwright-test` itself.
      - name: Setup
        run: |
          pnpm install --frozen-lockfile
          cd backend
          pnpm run setup
          chmod -R +x cli
          cd ..

      - name: Playwright tests
        run: pnpm run playwright-test

      - uses: actions/upload-artifact@v4.4.0
        if: failure()
        with:
          name: test-results
          path: ./test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4.4.0
        if: failure()
        with:
          name: playwright-html-report
          path: ./playwright-report/
          if-no-files-found: ignore
