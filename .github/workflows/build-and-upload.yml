name: Build and Upload

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types:
      - created

permissions: read-all

env:
  PRERELEASE: ${{ endsWith ( github.event.release.tag_name, '-prerelease' ) && '--pre-release' || '' }}

jobs:
  build_and_upload:
    name: Build and Upload
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          submodules: "true"
      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
      # Before packaging, so that neither marketplace gets a release that fails it.
      - name: Validate release
        if: github.event_name == 'release'
        run: |
          pnpm install --frozen-lockfile
          bash bin/validateRelease.sh ${{ github.event.release.tag_name }}
      - name: Package extension
        run: |
          chmod +x bin/package.bash
          bin/package.bash ${{ env.PRERELEASE }}
          mkdir extension && mv *.vsix extension
          # Surfaces size jumps on the run that caused them.
          echo "vsix: $(du -h extension/*.vsix | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CI: true
      - name: Upload artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: success()
        with:
          name: packaged-extension
          path: extension/
      # The vsix excludes the maps; this artifact is the only copy.
      - name: Upload source maps
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: success()
        with:
          name: source-maps
          path: dist/*.map

  # One job per marketplace, so either can be re-run alone with the same vsix. Both wait for
  # approval in the `release` environment.
  publish_vs_marketplace:
    name: Publish to Visual Studio Marketplace
    needs: build_and_upload
    if: github.event_name == 'release'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Download packaged extension
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packaged-extension
          path: extension/
      - name: Publish
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vsce publish -p ${{ secrets.VSCE_PUBLISH_TOKEN }} ${{ env.PRERELEASE }} --packagePath extension/*.vsix

  publish_open_vsx:
    name: Publish to Open VSX
    needs: build_and_upload
    if: github.event_name == 'release'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Download packaged extension
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packaged-extension
          path: extension/
      - name: Publish
        run: |
          pnpm install --frozen-lockfile
          pnpm exec ovsx publish extension/*.vsix -p ${{ secrets.OVSX_PUBLISHER_TOKEN }} ${{ env.PRERELEASE }}
